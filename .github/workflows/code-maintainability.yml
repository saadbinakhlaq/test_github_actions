name: Code Maintainability Check

on:
  pull_request:
    types: [opened, synchronize]
jobs:
  maintainability-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0        
      - name: install uv
        uses: ./.github/actions/install-uv   
      - name: Get Maintainability Index
        id: get_maintainability_index
        run: make code-maintainabilty
      - name: Comment on PR
        if: success() && hashFiles('check_maintainability_violations.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const body = fs.readFileSync('check_maintainability_violations.md', 'utf8');

            if (!pr) {
              core.warning("⚠️ No pull_request context found (maybe running locally with act). Skipping comment.");
              return;
            }

            await github.rest.issues.createComment({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });

